    <script>
      (function () {
        try {
          var saved = localStorage.getItem("dadefa-locale");
          var locale = "fa";
          if (saved) {
            var parsed = JSON.parse(saved);
            if (parsed && parsed.state && parsed.state.locale) {
              locale = parsed.state.locale;
            }
          }
          var dir = locale === "fa" ? "rtl" : "ltr";
          document.documentElement.setAttribute("lang", locale);
          document.documentElement.setAttribute("dir", dir);
        } catch (e) {
          document.documentElement.setAttribute("lang", "fa");
          document.documentElement.setAttribute("dir", "rtl");
        }
      })();
    </script>
    <script>
      (function () {
        try {
          const raw = localStorage.getItem("dadefa-theme-storage");
          let theme = null;
          if (raw) {
            theme = JSON.parse(raw)?.state?.theme;
          }
          if (theme !== "light" && theme !== "dark") {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          const root = document.documentElement;
          root.classList.remove("light", "dark");
          root.classList.add(theme);
          root.setAttribute("data-theme", theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body
    class="bg-background text-foreground antialiased selection:bg-primary/20">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
